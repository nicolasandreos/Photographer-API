services:
  mysql_database_dev:
    image: mysql:latest
    container_name: photographer_mysql_database

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: photostudio

    ports: 
      - "3310:3306"

    volumes:
      - mysql_volume:/var/lib/mysql

  mysql_database_test:
    image: mysql:latest
    container_name: photographer_mysql_database_test

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: photostudio_test

    ports:
      - "3311:3306"

    volumes:
      - mysql_volume_test:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis_database
    ports:
      - "6379:6379"
    volumes:
      - redis_volume:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_volume:
    driver: local
  mysql_volume_test:
    driver: local
  redis_volume:
    driver: local